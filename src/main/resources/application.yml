spring:
  application:
    name: family-os-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/familyos}
      auto-index-creation: true
  ai:
    openai:
      # Gemini through Google's OpenAI-compatible endpoint. Point base-url at api.openai.com
      # and set the model to gpt-4.1-mini to run on OpenAI instead; nothing else changes.
      api-key: ${GOOGLE_API_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY:}}}
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        completions-path: ${AI_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${AI_MODEL:gemini-2.5-flash}
          temperature: 0.2
      embedding:
        enabled: false
      audio:
        transcription:
          enabled: false
        speech:
          enabled: false
      image:
        enabled: false
      moderation:
        enabled: false

jwt:
  secret: ${JWT_SECRET:6f3c2a9e1b7d4c8f5a2e9d1c3b7a6f4e8d2c1b9a7f6e5d4c3b2a1f0e9d8c7b6a}
  refresh-token:
    expiration-minutes: 43200
  access-token:
    expiration-minutes: 60

server:
  port: ${PORT:5000}
  servlet:
    context-path: /api
  error:
    include-message: always

family-os:
  # Fix the clock for the seeded demo household so the fixtures always make sense.
  demo-now: 2026-09-01T18:30
  base-url: ${BASE_URL:http://localhost:5000}

springdoc:
  swagger-ui:
    operations-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
