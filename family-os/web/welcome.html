<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family OS</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; }
    .stage { width: 100%; max-width: 560px; }
    .step-n { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px; }
    .stage h1 { font-size: 36px; line-height: 1.08; font-weight: 700; }
    .stage .lede { font-size: 18px; color: var(--muted); margin: 12px 0 22px; }
    textarea.big { min-height: 220px; font-size: 17px; padding: 16px; border-radius: var(--r); }
    .people { display: grid; gap: 10px; margin: 8px 0 18px; }
    .pcard { display: grid; grid-template-columns: 40px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; align-items: center; }
    .pcard .pn { font-weight: 700; font-family: var(--display); font-size: 17px; }
    .pcard .pd { color: var(--muted); font-size: 14px; }
    .adult { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-weight: 700; }
    .thinking { display: flex; gap: 10px; align-items: center; color: var(--muted); margin-top: 16px; }
    .thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--need); animation: pulse 1s infinite ease-in-out; }
    @keyframes pulse { 0%,100% { transform: scale(.7); opacity: .5 } 50% { transform: scale(1); opacity: 1 } }
    .big-choice { display: grid; gap: 10px; margin: 8px 0 18px; }
    .big-choice button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 4px; }
    .big-choice button b { font-family: var(--display); font-size: 18px; }
    .big-choice button span { color: var(--muted); font-size: 14px; }
    .big-choice button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 10px; }
  </style>
</head>
<body>
  <div class="wrap"><div class="stage" id="stage"></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/welcome.js"></script>
</body>
</html>
